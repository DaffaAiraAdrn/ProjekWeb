name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd
          coverage: none

      - name: Install Composer
        run: |
          composer config audit.abandoned ignore
          composer config audit.security ignore
          composer install --no-dev --optimize-autoloader --no-interaction --no-audit

      - name: Prepare Deployment Package
        run: |
          # Remove development files that should not be deployed
          rm -rf .git .github tests node_modules .env.example
          # Create .env from example for production if .env doesn't exist
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Optimize Laravel for production
          php artisan key:generate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # Create storage symlink
          php artisan storage:link --force

      - name: Sync Files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            .git*
            .github/
            tests/
            node_modules/
            *.md
            .env.example
